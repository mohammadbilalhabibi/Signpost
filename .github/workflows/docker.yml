name: Docker

# Builds the real image (downloads the reranker and e5, ingests, builds the index) and starts
# it: health, sources, chat page, small talk, and one retrieval + reranking question. The LLM
# points to an unreachable local address, so no API key is used and no LLM call leaves the
# runner; that question must end in a clean 503 "llm_unavailable".
on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - constraints.txt
      - pyproject.toml
      - app/**
      - scripts/**
      - DIT_Arrival_RAG_English/**/sources.json
      - DIT_Arrival_RAG_English/**/text/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - constraints.txt
      - pyproject.toml
      - app/**
      - scripts/**
      - DIT_Arrival_RAG_English/**/sources.json
      - DIT_Arrival_RAG_English/**/text/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push the image to ghcr.io (only on pushes to main)

env:
  IMAGE: ghcr.io/mohammadbilalhabibi/signpost

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (preinstalled SDKs the build does not need)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        run: |
          set +e
          docker build --progress=plain \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t signpost . 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are public: the error is readable without admin rights to the logs.
            msg=$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=docker build failed::${msg}"
          fi
          exit "$status"

      - name: Image size
        run: |
          size=$(docker image ls signpost --format "{{.Size}}")
          echo "image size: $size"
          echo "::notice title=Image size::$size"

      - name: Start container (no API key; LLM unreachable on purpose)
        run: |
          docker run -d --name signpost -p 7860:7860 \
            -e LLM_BASE_URL=http://127.0.0.1:9/v1 -e LLM_TIMEOUT=5 signpost
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/api/health > health.json 2>/dev/null; then
              echo "ready after ~$((i * 5)) s"; cat health.json; echo; exit 0
            fi
            sleep 5
          done
          echo "container did not become healthy"; docker logs signpost | tail -80
          msg=$(docker logs signpost 2>&1 | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=container did not become healthy::${msg}"
          exit 1

      - name: Memory after startup
        run: |
          usage=$(docker stats --no-stream --format "{{.MemUsage}} (CPU {{.CPUPerc}})" signpost)
          echo "after startup: $usage"
          echo "::notice title=Memory after startup (docker stats)::$usage"

      - name: Check the running app
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, urllib.error, urllib.request

          BASE = "http://127.0.0.1:7860"

          def get(path):
              with urllib.request.urlopen(BASE + path, timeout=60) as r:
                  return r.status, r.read().decode()

          def ask(question):
              req = urllib.request.Request(
                  BASE + "/api/ask",
                  data=json.dumps({"question": question}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read())

          health = json.loads(get("/api/health")[1])
          assert health["status"] == "ok" and health["models_loaded"], health
          assert health["chunks"] == 191 and health["documents"] == 30, health
          assert health["models"]["reranker"].endswith("(onnx)"), health
          print("health ok:", health["chunks"], "chunks,", health["documents"], "documents")

          sources = json.loads(get("/api/sources")[1])
          assert sources["count"] == 30, sources["count"]
          print("sources ok:", sources["count"])

          status, page = get("/")
          assert status == 200 and "Signpost" in page
          print("chat page ok")

          status, body = ask("Hi! I am new here.")
          assert status == 200 and body["response_type"] == "smalltalk", (status, body)
          print("small talk ok")

          # Retrieval and ONNX reranking run inside the container; the LLM call then fails.
          for question in [
              "How do I register my address in Deggendorf?",
              "Which DIT fees do I have to pay?",
              "Can I work while studying as a non-EU student?",
          ]:
              status, body = ask(question)
              assert status == 503 and body["error"]["code"] == "llm_unavailable", (status, body)
          print("3 questions: retrieval + reranking ran; LLM unreachable as intended -> 503")
          EOF

      - name: Memory after 3 questions
        run: |
          usage=$(docker stats --no-stream --format "{{.MemUsage}}" signpost)
          peak=$(docker exec signpost cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo "")
          peak_mib=$([ -n "$peak" ] && echo "$((peak / 1024 / 1024)) MiB" || echo "n/a")
          echo "after 3 questions: $usage; peak since start: $peak_mib"
          echo "::notice title=Memory after 3 questions (docker stats)::now $usage, peak $peak_mib"

      - name: Container logs
        if: always()
        run: docker logs signpost 2>&1 | tail -60 || true

      # Pushes on main, and on a manual run ("Run workflow") on main, e.g. to publish an image
      # for a commit that only changed files outside the paths filter above.
      - name: Push to GitHub Container Registry
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag signpost "$IMAGE:latest"
          docker tag signpost "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          echo "::notice title=Pushed::$IMAGE:latest and $IMAGE:${GITHUB_SHA}"
