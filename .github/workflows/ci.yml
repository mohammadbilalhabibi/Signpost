name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The fast test suite uses fake models: forbid any Hugging Face download, no API key.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install CPU-only PyTorch and the project
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (fast suite; tests marked slow need real models and are skipped)
        run: pytest
