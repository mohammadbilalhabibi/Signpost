[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "degbot"
version = "0.1.0"
description = "Bilingual (DE/EN) RAG assistant for international students at DIT and in Bavaria."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Parsing
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "langdetect>=1.0.9",
    # Retrieval
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    # Generation (OpenAI-compatible client)
    "openai>=1.40",
    # Config & utilities
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "index"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
